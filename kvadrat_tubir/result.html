<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нәтиже — Квадрат Түбір</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="result-page">
  <div class="result-card">
    <div class="winner-badge" id="winnerBadge">🏆</div>
    <h2 class="result-title" id="winnerTitle">Жеңімпаз!</h2>

    <div class="podium" id="podium"></div>

    <div style="background:var(--mint);border-radius:14px;padding:16px 20px;margin-bottom:20px;">
      <p style="font-weight:700;color:var(--text-light);font-size:0.9rem;margin-bottom:4px;">📊 Жалпы ұпай</p>
      <div id="totalBar"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-green" onclick="window.location.href='game.html'">⬅ Ойынға қайту</button>
      <button class="btn btn-outline" onclick="resetGame()">🔄 Жаңа ойын</button>
    </div>
  </div>
</div>
<div class="confetti-wrap" id="confettiWrap"></div>

<script src="audio.js"></script>
<script>
window.addEventListener('load', () => { setTimeout(() => audio.playWin(), 300); });
const TEAMS = JSON.parse(localStorage.getItem('kv_teams') || '["1-топ","2-топ"]');
const scores = JSON.parse(localStorage.getItem('kv_scores') || '[0,0]');
const EMOJIS = ['🦁','🐯','🦊','🐻'];
const MEDALS = ['🥇','🥈','🥉','🎖️'];
const RANK_CLASSES = ['rank-1','rank-2','rank-3','rank-3'];

const ranked = TEAMS.map((t, i) => ({ name: t, score: scores[i], emoji: EMOJIS[i] }))
  .sort((a, b) => b.score - a.score);

document.getElementById('winnerTitle').textContent = `🎉 ${ranked[0].name} жеңді!`;
document.getElementById('winnerBadge').textContent = ranked[0].emoji;

const podium = document.getElementById('podium');
podium.innerHTML = ranked.map((r, i) => `
  <div class="podium-row ${RANK_CLASSES[i]}">
    <span>${MEDALS[i]} <span class="rank-medal">${r.emoji}</span> ${r.name}</span>
    <span style="font-size:1.3rem">${r.score} ұпай</span>
  </div>
`).join('');

const maxScore = Math.max(...scores, 1);
document.getElementById('totalBar').innerHTML = TEAMS.map((t, i) => `
  <div style="margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;color:var(--text-light);margin-bottom:4px">
      <span>${EMOJIS[i]} ${t}</span><span>${scores[i]} ұп</span>
    </div>
    <div style="background:var(--green-100);border-radius:50px;height:12px;overflow:hidden">
      <div style="width:${(scores[i]/maxScore*100).toFixed(1)}%;height:100%;background:var(--green-500);border-radius:50px;transition:width 1s ease"></div>
    </div>
  </div>
`).join('');

// Confetti
const wrap = document.getElementById('confettiWrap');
const colors = ['#4ade80','#fbbf24','#60a5fa','#f87171','#a78bfa','#34d399'];
for (let i = 0; i < 80; i++) {
  const p = document.createElement('div');
  p.className = 'confetti-piece';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.background = colors[Math.floor(Math.random()*colors.length)];
  p.style.animationDuration = (2 + Math.random() * 3) + 's';
  p.style.animationDelay = (Math.random() * 2) + 's';
  p.style.width = p.style.height = (6 + Math.random() * 10) + 'px';
  p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
  wrap.appendChild(p);
}

function resetGame() {
  localStorage.clear();
  window.location.href = 'index.html';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ойын тақтасы — Квадрат Түбір</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div style="display:flex;align-items:center">
    <span class="logo-emoji">🌿</span>
    <h1>Квадрат Түбір — Жарыс</h1>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-outline" style="font-size:0.85rem;padding:8px 16px;" onclick="if(confirm('Ойынды қайта бастау?')) { localStorage.clear(); window.location.href='index.html'; }">↩ Бастауға</button>
    <button class="btn btn-green" style="font-size:0.85rem;padding:8px 16px;" onclick="window.location.href='result.html'">🏆 Нәтиже</button>
  </div>
</header>

<!-- SCORE BAR -->
<div class="scorebar" id="scorebar"></div>

<!-- BOARD -->
<div class="board-container">
  <h2 class="board-title">📋 Категория таңдаңыз</h2>
  <div class="board" id="board"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div>
        <span class="modal-points" id="mPoints">100 ұпай</span>
        <span style="font-size:0.85rem;color:var(--text-light);margin-left:8px" id="mLevel"></span>
      </div>
      <button class="btn btn-outline" style="padding:6px 14px;font-size:0.85rem" onclick="closeModal()">✕ Жабу</button>
    </div>

    <p class="modal-question" id="mQuestion"></p>

    <img id="mImage" class="modal-image" src="" alt="" style="display:none">

    <div class="timer-ring" id="timerRing">
      <svg viewBox="0 0 80 80" width="80" height="80">
        <circle class="bg" cx="40" cy="40" r="34"/>
        <circle class="progress" id="timerCircle" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text" id="timerText">30</div>
    </div>

    <div class="modal-hint" id="mHint"></div>
    <div class="modal-answer" id="mAnswer"></div>

    <div class="btn-row" id="btnRow1">
      <button class="btn btn-yellow" onclick="showHint()">💡 Кеңес</button>
      <button class="btn btn-green" onclick="showAnswer()">👁 Жауапты көру</button>
    </div>

    <div id="awardSection" style="display:none;margin-top:16px">
      <p class="award-label">🏅 Қай топ дұрыс жауап берді?</p>
      <div class="award-row" id="awardRow"></div>
      <div style="margin-top:10px;text-align:center">
        <button class="btn btn-outline" onclick="awardTeam(-1)">❌ Ешкім жауап бермеді</button>
      </div>
    </div>
  </div>
</div>

<script src="audio.js"></script>
<script src="questions.js"></script>
<script>
const TEAMS = JSON.parse(localStorage.getItem('kv_teams') || '["1-топ","2-топ"]');
const EMOJIS = ['🦁','🐯','🦊','🐻'];
let scores = JSON.parse(localStorage.getItem('kv_scores') || '[0,0]');
let turn = parseInt(localStorage.getItem('kv_turn') || '0');
let used = JSON.parse(localStorage.getItem('kv_used') || '[]');

let timerInterval = null;
let timerVal = 30;
let currentCell = null;
let currentPoints = 0;

const CATS = Object.keys(QUESTIONS);

function save() {
  localStorage.setItem('kv_scores', JSON.stringify(scores));
  localStorage.setItem('kv_turn', String(turn));
  localStorage.setItem('kv_used', JSON.stringify(used));
}

function renderScorebar() {
  const sb = document.getElementById('scorebar');
  sb.innerHTML = TEAMS.map((t, i) => `
    <div class="team-score ${i === turn ? 'active' : ''}">
      <span>${EMOJIS[i]}</span>
      <span>${t}</span>
      <span class="points" style="background:${i===turn?'rgba(255,255,255,0.3)':'var(--green-200)'};padding:2px 10px;border-radius:50px">${scores[i]} ұп</span>
    </div>
  `).join('') + `<span class="turn-label">🎯 Кезек: ${EMOJIS[turn]} ${TEAMS[turn]}</span>`;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = CATS.map((cat, ci) => {
    const catData = QUESTIONS[cat];
    const cells = catData.questions.map((q, qi) => {
      const key = `${cat}_${qi}`;
      const isUsed = used.includes(key);
      return `<div class="cell cat-${ci} ${isUsed ? 'used' : ''}" 
        onclick="${isUsed ? '' : `openModal('${cat}',${qi})`}">
        ${isUsed ? '' : q.points}
      </div>`;
    }).join('');
    return `<div class="category-col cat-${ci}">
      <div class="category-header">${catData.label}</div>
      ${cells}
    </div>`;
  }).join('');
}

function openModal(cat, qi) {
  const q = QUESTIONS[cat].questions[qi];
  currentCell = { cat, qi };
  currentPoints = q.points;

  document.getElementById('mPoints').textContent = q.points + ' ұпай';
  document.getElementById('mLevel').textContent = q.level;
  document.getElementById('mQuestion').textContent = q.question;

  const img = document.getElementById('mImage');
  if (q.image) {
    img.src = q.image;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }

  const hint = document.getElementById('mHint');
  hint.textContent = '💡 ' + q.hint;
  hint.classList.remove('show');

  const ans = document.getElementById('mAnswer');
  ans.innerHTML = '✅ Жауап: ' + q.answer;
  ans.classList.remove('show');

  document.getElementById('awardSection').style.display = 'none';
  document.getElementById('btnRow1').style.display = 'flex';

  // Timer
  clearInterval(timerInterval);
  timerVal = 30;
  updateTimer(30, 30);
  timerInterval = setInterval(() => {
    timerVal--;
    updateTimer(timerVal, 30);
    if (timerVal <= 0) {
      clearInterval(timerInterval);
      audio.playWrong();
      showAnswer();
    } else if (timerVal <= 5) {
      audio.playTimerTick();
    }
  }, 1000);

  document.getElementById('modalOverlay').style.display = 'flex';
}

function updateTimer(val, max) {
  const circ = document.getElementById('timerCircle');
  const txt = document.getElementById('timerText');
  const dashArr = 213.6;
  const offset = dashArr * (1 - val / max);
  circ.style.strokeDashoffset = offset;
  const hue = Math.round(val / max * 120);
  circ.style.stroke = `hsl(${hue}, 80%, 45%)`;
  txt.textContent = val;
  txt.style.color = val <= 5 ? '#ef4444' : 'var(--green-700)';
}

function showHint() {
  document.getElementById('mHint').classList.add('show');
}

function showAnswer() {
  clearInterval(timerInterval);
  document.getElementById('mAnswer').classList.add('show');
  document.getElementById('btnRow1').style.display = 'none';
  document.getElementById('awardSection').style.display = 'block';

  // Build award buttons
  const aRow = document.getElementById('awardRow');
  aRow.innerHTML = TEAMS.map((t, i) =>
    `<button class="award-btn" onclick="awardTeam(${i})">${EMOJIS[i]} ${t}</button>`
  ).join('');
}

function awardTeam(idx) {
  const { cat, qi } = currentCell;
  const key = `${cat}_${qi}`;
  used.push(key);

  if (idx >= 0) {
    scores[idx] += currentPoints;
    audio.playCorrect();
    showPointsToast(`+${currentPoints} ұпай! ${EMOJIS[idx]} ${TEAMS[idx]}`);
  } else {
    audio.playWrong();
  }

  // Advance turn
  turn = (turn + 1) % TEAMS.length;
  save();
  closeModal();
  renderBoard();
  renderScorebar();

  // Check if all done
  const totalCells = CATS.reduce((s, c) => s + QUESTIONS[c].questions.length, 0);
  if (used.length >= totalCells) {
    setTimeout(() => {
      if (confirm('🎉 Барлық сұрақтар аяқталды! Нәтижені көру?')) {
        window.location.href = 'result.html';
      }
    }, 500);
  }
}

function showPointsToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;top:80px;right:20px;background:var(--green-500);color:white;
    padding:12px 24px;border-radius:50px;font-weight:800;font-size:1rem;z-index:9999;
    animation:slideUp 0.3s ease,fadeOut 0.5s ease 1.5s forwards;box-shadow:var(--shadow-lg)`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2100);
}

function closeModal() {
  clearInterval(timerInterval);
  document.getElementById('modalOverlay').style.display = 'none';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// Init
renderScorebar();
renderBoard();
</script>

<style>
@keyframes fadeOut { from{opacity:1} to{opacity:0} }
</style>
</body>
</html>
